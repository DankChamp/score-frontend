<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAF9F6">
  <meta name="color-scheme" content="light dark">
  <script>
    document.documentElement.classList.add('js');
    (function () {
      try {
        var stored = localStorage.getItem('score-ai-theme');
        var dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#0B0B0A');
        }
      } catch (error) {}
    })();
  </script>
  <meta name="description" content="Score AI Student Login - Access your personalized dashboard.">
  <title>Login — Score AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="auth-layout">
  <header class="site-header" role="banner" style="background: transparent; border: none; backdrop-filter: none;">
    <div class="container header-inner" style="justify-content: flex-end;">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
        <svg data-theme-icon="sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <svg data-theme-icon="moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </div>
  </header>
  <main class="auth-card card">
    <header class="auth-header">
      <h1 class="auth-title">Student Login</h1>
      <p class="auth-subtitle">Score AI</p>
    </header>
    <form class="auth-form" action="#" method="post">
      <div class="field-group">
        <label for="studentId" class="field-label">Student ID</label>
        <input type="text" id="studentId" name="studentId" class="field-input" placeholder="Enter your student ID" required autocomplete="username">
      </div>
      <div class="field-group">
        <label for="password" class="field-label">Password</label>
        <input type="password" id="password" name="password" class="field-input" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-full">Login</button>
    </form>
    <div class="auth-footer">
      <p>Don't have an account?</p>
      <p>Contact Void or Codi to create your student account.</p>
    </div>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
