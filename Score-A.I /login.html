<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Score AI Student Login - Access your personalized dashboard.">
  <title>Login — Score AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <noscript><style>[data-reveal]{opacity:1!important;transform:none!important;transition:none!important}</style></noscript>
<base target="_blank">
</head>
<body class="auth-layout page-entrance">
  <header class="site-header" role="banner" style="background: transparent; border: none; backdrop-filter: none;">
    <div class="container header-inner" style="justify-content: flex-end;">
      <select id="login-lang-selector" class="field-input" style="width: auto; padding: var(--space-2) var(--space-3); font-size: var(--scale-sm); margin-right: var(--space-3);" aria-label="Select language">
        <option value="en">English</option>
        <option value="hinglish">Hinglish</option>
      </select>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
        <svg data-theme-icon="sun" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <svg data-theme-icon="moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </div>
  </header>
  <article data-reveal class="auth-card card">
    <header class="auth-header">
      <h1 class="auth-title" data-i18n="login.title">Student Login</h1>
      <p class="auth-subtitle" data-i18n="login.subtitle">Score AI</p>
    </header>
    <form class="auth-form" id="login-form">
      <div class="field-group">
        <label for="login-email" class="field-label" data-i18n="login.email">Email</label>
        <input type="email" id="login-email" name="email" class="field-input" placeholder="Enter your email" required autocomplete="username">
      </div>
      <div class="field-group">
        <label for="login-password" class="field-label" data-i18n="login.password">Password</label>
        <input type="password" id="login-password" name="password" class="field-input" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <label style="display: flex; align-items: center; gap: var(--space-2); font-size: var(--scale-sm); color: var(--graphite);">
          <input type="checkbox" name="remember"> <span data-i18n="login.remember">Remember me</span>
        </label>
        <a href="#" style="font-size: var(--scale-sm); color: var(--blueprint);" data-i18n="login.forgot">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary w-full" data-i18n="login.button">Login</button>
    </form>
    <div class="auth-footer">
      <p data-i18n="login.noAccount">Don't have an account? Contact Void or Codi.</p>
    </div>
  </article>

  <script src="assets/js/app.js"></script>
</body>
</html>
